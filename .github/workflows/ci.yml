name: CI

# Baseline reconstruction CI.
#
# Every step below invokes a script that is actually defined in package.json.
#
# `test:a11y` exists as of S2-20 and runs here. It renders the real screens into
# jsdom and drives them by keyboard. What it does NOT do is see paint: jsdom
# computes no layout and resolves no custom properties, so contrast ratios and
# "is the focus ring visible" remain GUI review (scope §6, last paragraph). A
# green a11y step is evidence about roles, names, live regions, tab order and
# keyboard operability — not about how the app looks.
#
# A green run here is evidence of buildability only. It is NOT evidence that the
# Electron GUI was manually exercised, and never evidence of Windows support.

on:
  push:
    branches:
      - main
      - 'reconstruct/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run on main. Every commit on main is a persisted work unit, and
  # a unit whose CI was cancelled by the next commit has no verified run of its
  # own — which is exactly what happened to S2-06's commit. On branches and PRs,
  # superseding an in-flight run is still the right behaviour.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Node 22 matches the toolchain the Stage 1 baseline was validated on
      # (Node v22.22.2 / npm 10.9.7 — see docs/RECONSTRUCTION_CONTEXT.md).
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # `npm ci` (not `npm install`) so the committed lock file is authoritative.
      - name: Install dependencies from lock file
        run: npm ci

      - name: Typecheck (renderer + electron tsconfigs)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test suite
        run: npm test

      # Run explicitly for a clear signal, even though `npm test` also covers
      # these paths — a regression in the statistics core or in content
      # cross-reference integrity should be identifiable at a glance.
      - name: Statistical tests
        run: npm run test:statistics

      - name: Content validation
        run: npm run test:content

      # Renders the real screens into jsdom. Separate config, separate
      # environment: the other 695 checks run in `node` on a pure core, and a
      # DOM there would be weight without purpose.
      - name: Accessibility harness
        run: npm run test:a11y

      - name: Production build
        run: npm run build
