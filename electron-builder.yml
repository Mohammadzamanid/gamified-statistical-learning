appId: com.statlas.app
productName: Statlas
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - dist-electron/**
  - package.json
asar: true
linux:
  target:
    - dir
  category: Education
  icon: build/icon.png
win:
  target:
    - nsis
  icon: build/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Statlas
  artifactName: Statlas-Setup-${version}.exe
